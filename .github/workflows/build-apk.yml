name: Build Signed Release APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Cordova and AdMob Plugin
        run: |
          npm install -g cordova
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          cordova platform add android@13.0.0 --no-telemetry
          cordova plugin add admob-plus-cordova@^2.0.0 --variable APP_ID_ANDROID=ca-app-pub-2255298899514160~1925829210 --no-telemetry || true

      - name: Generate Keystore and Build Release APK + AAB
        run: |
          keytool -genkey -v -keystore candyquest.keystore -alias candyquest -keyalg RSA -keysize 2048 -validity 10000 -storepass CandyQuest2026 -keypass CandyQuest2026 -dname "CN=Candy Quest Pro, OU=Games, O=Throne, L=New Delhi, S=Delhi, C=IN"
          cat << 'EOF' > build.json
          {
            "android": {
              "release": {
                "keystore": "candyquest.keystore",
                "storePassword": "CandyQuest2026",
                "alias": "candyquest",
                "password": "CandyQuest2026",
                "keystoreType": "pkcs12"
              }
            }
          }
          EOF
          cordova build android --release --buildConfig=build.json -- --packageType=apk
          cordova build android --release --buildConfig=build.json -- --packageType=bundle
          mkdir -p release-files
          cp platforms/android/app/build/outputs/apk/release/app-release.apk release-files/CandyQuestPro-release.apk
          cp platforms/android/app/build/outputs/bundle/release/app-release.aab release-files/CandyQuestPro-release.aab
          cp candyquest.keystore release-files/candyquest.keystore

      - name: Upload Release APK, AAB and Keystore
        uses: actions/upload-artifact@v4
        with:
          name: CandyQuestPro-Release-Build
          path: release-files/
          
